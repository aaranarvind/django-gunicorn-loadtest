# Half Load Test Configuration
# Generates ~50% load to observe partial worker utilization patterns
#
# Usage: locust -f locustfile.py --config half_load.conf

host = http://localhost:8000
users = 50
spawn-rate = 5
run-time = 5m
headless = true
csv = results/half_load
html = results/half_load_report.html
logfile = results/half_load.log
