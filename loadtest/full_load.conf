# Full Load Test Configuration
# Saturates all uWSGI workers to observe 100% utilization patterns
#
# Usage: locust -f locustfile.py --config full_load.conf

host = http://localhost:8000
users = 100
spawn-rate = 10
run-time = 5m
headless = true
csv = results/full_load
html = results/full_load_report.html
logfile = results/full_load.log
