[uwsgi]
# ---- Server Socket ----
http = 0.0.0.0:8000
# Use socket for nginx proxy: socket = 0.0.0.0:8000

# ---- Application ----
module = myapp.wsgi:application
chdir = /app

# ---- Process Model ----
# CHANGE THESE to test different worker/process counts
# Override via env: UWSGI_PROCESSES, UWSGI_THREADS
processes = %(%k[UWSGI_PROCESSES]|5)
threads = %(%k[UWSGI_THREADS]|1)
enable-threads = true

# ---- Master Process ----
master = true
pidfile = /tmp/uwsgi-master.pid

# ---- Worker Management ----
max-requests = 1000
max-requests-delta = 50
harakiri = 120
harakiri-verbose = true

# ---- Stats Server ----
# Exposes uWSGI internal stats as JSON on port 9191
stats = 0.0.0.0:9191
stats-http = true

# ---- Memory Management ----
reload-on-rss = 256
worker-reload-mercy = 10

# ---- Logging ----
# Log which worker PID handled each request
log-format = [pid: %(pid)] %(addr) - %(method) %(uri) => %(status) (%(msecs)ms)
logto = /dev/stdout
logto2 = /dev/stderr

# ---- Performance ----
thunder-lock = true
vacuum = true
single-interpreter = true

# ---- Python ----
pythonpath = /app

# ---- Hooks ----
# Import our metrics collector on worker spawn
import = metrics.uwsgi_hooks
